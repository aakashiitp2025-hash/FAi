<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Odyssey · The Broken Market</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--bg:#111817;--panel:#1a2320;--muted:#a4b3a8;--lime:#d7ef89;--line:#334137}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f0f2e8;font:16px 'DM Sans',sans-serif}button,a{ -webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#253129;color:#f0f2e8;border-radius:9px;padding:12px 17px}button:hover{border-color:var(--lime);background:#344433}button:focus-visible,a:focus-visible{outline:3px solid #eac17c;outline-offset:4px}button:disabled{opacity:.4;cursor:not-allowed}header{height:90px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4vw}.brand{display:flex;gap:13px;text-decoration:none;color:var(--lime);font:700 23px 'Space Grotesk',sans-serif;align-items:center}.brand small{display:block;font:10px 'DM Sans';letter-spacing:2px;color:var(--muted);margin-top:5px}main{display:grid;grid-template-columns:270px 1fr;max-width:1500px;margin:auto;min-height:calc(100vh - 90px)}aside{padding:45px 26px;border-right:1px solid var(--line);position:relative}h1,h2,h3{font-family:'Space Grotesk',sans-serif}aside h2{font-size:24px;margin:17px 0 8px}p{line-height:1.7;color:var(--muted)}aside p{font-size:14px}.eyebrow,.topline{font-size:11px;letter-spacing:1.6px;color:var(--muted)}nav{display:grid;gap:10px;margin:38px 0}nav button{text-align:left;background:transparent;border-color:transparent;display:flex;gap:14px;align-items:center;font-size:13px;padding:14px 10px}nav button.active{background:#2a3829;color:var(--lime);border-color:#45543b}nav b{font:13px 'Space Grotesk';border:1px solid #52604c;border-radius:50%;width:27px;height:27px;display:grid;place-items:center;flex-shrink:0}.sidefoot{font-size:11px;color:var(--muted);margin-top:60px}.sidefoot button{font-size:11px;padding:8px;background:transparent}.signal{display:inline-block;width:6px;height:6px;background:var(--lime);border-radius:50%;margin-right:5px}.workspace{padding:30px 5vw 60px;min-width:0}.topline{display:flex;justify-content:space-between;margin-bottom:36px;font-size:10px}.tag{display:inline-block;color:var(--lime);font-size:11px;letter-spacing:1.8px;border:1px solid #516044;padding:8px 11px;border-radius:30px}h1{font-size:clamp(32px,4vw,58px);line-height:1.08;letter-spacing:-2px;margin:22px 0}h1 em{font-style:normal;color:var(--lime)}.lead{max-width:620px;font-size:17px}.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center}.art{height:330px;background:radial-gradient(ellipse at center,#445332 0,#202c24 60%,#19231e 100%);border:1px solid #43523b;border-radius:160px 160px 20px 20px;position:relative;overflow:hidden;display:grid;place-items:center}.stall{font-size:110px;filter:drop-shadow(0 20px 25px #0008)}.art:after{content:'SECTOR 02 · MARKET DISTRICT';position:absolute;bottom:20px;font-size:9px;letter-spacing:2px;color:var(--lime)}.orb{position:absolute;top:30px;right:35px;font-size:30px}.dialogue{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--lime);border-radius:10px;padding:22px 25px;margin:25px 0}.dialogue strong{font-size:11px;letter-spacing:1.5px;color:var(--lime)}.dialogue p{margin:10px 0 0;color:#e1e7dc}.primary{background:var(--lime);color:#1d281b;border:0;font-weight:700;padding:16px 24px}.primary:hover{background:#e6ffaa}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.meta{font-size:12px;color:var(--muted);margin-top:18px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.card{background:var(--panel);border:1px solid var(--line);padding:20px;border-radius:12px}.card .emoji{font-size:39px;display:block;margin-bottom:12px}.card h3{margin:8px 0;font-size:17px}.card p{font-size:13px}.card button{width:100%;margin-top:8px;font-size:12px;padding:10px}.card small{color:var(--lime);font-size:12px}.feedback{padding:18px;background:#263626;border:1px solid #536a43;border-radius:9px;margin:20px 0;line-height:1.6}.feedback.bad{background:#3a2e25;border-color:#805a3c}.note{font-size:12px;color:var(--muted)}.question{background:var(--panel);border:1px solid var(--line);padding:22px;border-radius:12px;margin:20px 0}.options{display:grid;gap:10px}.options button{text-align:left}.options button.selected{border-color:var(--lime);color:var(--lime)}.stats{display:flex;gap:25px;flex-wrap:wrap;margin:25px 0}.stat{background:var(--panel);padding:18px 23px;border-radius:10px}.stat b{display:block;color:var(--lime);font-size:27px}.stat small{color:var(--muted)}dialog{background:var(--bg);color:#eee;border:1px solid var(--line);border-radius:16px;max-width:650px;width:90%;max-height:85vh;padding:28px}dialog::backdrop{background:#000b}#close{float:right}.journalitem{border-bottom:1px solid var(--line);padding:12px 0}.journalitem h3{color:var(--lime)}.locked{opacity:.55}.map{display:grid;gap:14px;margin:30px 0}.map .card{display:flex;gap:20px;align-items:center}.map h3{margin:0}.map p{margin:5px 0}.certificate{text-align:center;border:1px solid #6e804c;padding:32px;border-radius:14px;background:radial-gradient(ellipse at top,#354329,var(--panel))}@media(max-width:850px){main{grid-template-columns:1fr}aside{padding:20px;border-right:0;border-bottom:1px solid var(--line)}aside h2,aside>p,aside>.eyebrow,.sidefoot{display:none}nav{display:flex;overflow-x:auto;margin:0;gap:4px}nav button{white-space:nowrap;padding:8px;font-size:11px}nav b{width:22px;height:22px}.workspace{padding:25px 6vw}.hero{grid-template-columns:1fr}.art{height:210px;grid-row:1}.stall{font-size:90px}.cards{grid-template-columns:1fr 1fr}header{padding:0 6vw;height:76px}.brand{font-size:18px}header button{font-size:12px;padding:9px}.topline{font-size:8px;letter-spacing:1px}.lead{font-size:15px}}@media(max-width:450px){.cards{grid-template-columns:1fr}.card{padding:15px}.card .emoji{font-size:30px}h1{letter-spacing:-1px}}
</style></head><body><header><a href="index.html" class="brand">✳ <span>AI ODYSSEY<small>THE CITY THAT FORGOT</small></span></a><button id="journal">Concept journal ↗</button></header><main><aside><span class="eyebrow">YOUR EXPEDITION</span><h2>Restore the city.</h2><p>One discovery at a time.</p><nav id="steps"></nav><div class="sidefoot"><span class="signal"></span> Progress saved on this browser<p id="saveNotice"></p><button id="reset">Restart chapter</button></div></aside><section class="workspace"><div class="topline"><span>CHAPTER 02 / THE BROKEN MARKET</span><span id="progress"></span></div><div id="scene"></div></section></main><dialog id="modal"><button id="close">Close ✕</button><div id="modalContent"></div></dialog><script>const $=s=>document.querySelector(s),key='ai-odyssey-market-v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{};
let state={stage:0,max:0,labels:{},trained:false,expanded:false,tested:false,answers:{},attempt:0,passed:false,...saved};
state.stage=Math.max(0,Math.min(5,Number(state.stage)||0));state.max=Math.max(state.stage,Math.min(5,Number(state.max)||0));
const names=['Arrival','A rule goes wrong','Teach the robot','Field test','Unlock challenge','District restored'];
const items=[{id:'a',name:'Red apple',emoji:'🍎',color:'red',shape:'round',label:'apple'},{id:'b',name:'Another red apple',emoji:'🍎',color:'red',shape:'round',label:'apple'},{id:'c',name:'Yellow banana',emoji:'🍌',color:'yellow',shape:'curved',label:'banana'},{id:'d',name:'Another yellow banana',emoji:'🍌',color:'yellow',shape:'curved',label:'banana'},{id:'e',name:'Green apple',emoji:'🍏',color:'green',shape:'round',label:'apple'},{id:'f',name:'Yellow apple',emoji:'🟡',color:'yellow',shape:'round',label:'apple'}];
const tests=[{name:'Green apple',color:'green',shape:'round',label:'apple',emoji:'🍏'},{name:'Red banana',color:'red',shape:'curved',label:'banana',emoji:'🍌'}];
function persist(){try{localStorage.setItem(key,JSON.stringify(state))}catch{$('#saveNotice').textContent='Storage unavailable. Keep this tab open.'}}
function go(n){state.stage=n;state.max=Math.max(state.max,n);persist();render();window.scrollTo({top:0,behavior:'smooth'})}
function intro(tag,title,text){return `<span class="tag">${tag}</span><h1>${title}</h1><p class="lead">${text}</p>`}
function say(text){return `<div class="dialogue"><strong>MIRA / MARKET KEEPER</strong><p>${text}</p></div>`}
function next(text,n){return `<div class="actions"><button class="primary" data-go="${n}">${text} →</button></div>`}
function render(){
$('#steps').innerHTML=names.map((n,i)=>`<button class="${i===state.stage?'active':''}" data-go="${i}" ${i>state.max?'disabled':''}><b>${i<state.max?'✓':String(i+1).padStart(2,'0')}</b>${n}</button>`).join('');$('#progress').textContent=`${Math.round(state.stage/5*100)}% RESTORED`;
let html='';
if(state.stage===0)html=`<div class="hero"><div>${intro('A LEARNING ADVENTURE','A city forgotten.<br><em>A mind to rebuild.</em>','The market has gone silent. A delivery robot is making impossible mistakes. Your first mission: help it learn.')}<div class="actions"><button class="primary" data-go="1">Enter the market ↗</button></div><p class="meta">◷ 10–15 minutes &nbsp; · &nbsp; No coding needed</p></div><div class="art" role="img" aria-label="A market stall beneath a glowing signal"><span class="orb">✳</span><span class="stall">🏪</span></div></div>${say('You made it. Our city’s intelligence has scattered, and Pip is sorting everything by one old rule. We need a curious mind. Yours will do.')}<p class="note">Chapter 02 pilot · Foundations of AI · Explore, experiment, and unlock the next district.</p>`;
if(state.stage===1)html=intro('MISSION 01 / INVESTIGATE','One rule.<br><em>Three problems.</em>','Pip follows this instruction exactly: “If it is red, send it to the apple stall. Otherwise, send it away.”')+`<div class="cards">${[{emoji:'🍎',name:'Red apple',out:'Apple stall',ok:true},{emoji:'🍅',name:'Red tomato',out:'Apple stall',ok:false},{emoji:'🍏',name:'Green apple',out:'Sent away',ok:false}].map(x=>`<div class="card"><span class="emoji">${x.emoji}</span><h3>${x.name}</h3><p>Pip’s decision: ${x.out}</p><small>${x.ok?'✓ Correct':'✕ Wrong delivery'}</small></div>`).join('')}</div>`+say('Pip did exactly what we told it. The problem is our rule. Why did it fail?')+`<div class="options"><button data-rule="wrong">Pip needs to follow the same rule faster.</button><button data-rule="right">Colour alone does not tell us whether something is an apple.</button><button data-rule="wrong">All automation is artificial intelligence.</button></div><div id="ruleFeedback" aria-live="polite"></div>`;
if(state.stage===2){const data=state.expanded?items:items.slice(0,4);html=intro('MISSION 02 / TRAIN','Less instruction.<br><em>More examples.</em>','A new shipment contains only apples and bananas. Give Pip labelled examples. It will choose a useful pattern from colour and shape.')+say(state.expanded?'Good. Let’s add green and yellow apples. These examples can challenge Pip’s colour shortcut.':'Label the four examples. Pip can see both colour and shape, but has never seen a green apple in this shipment.')+`<div class="cards">${data.map(x=>`<div class="card"><span class="emoji">${x.emoji}</span><h3>${x.name}</h3><p>${x.color} · ${x.shape}</p><button data-label="${x.id}" data-value="apple" class="${state.labels[x.id]==='apple'?'selected':''}">${state.labels[x.id]==='apple'?'✓ ':''}Apple</button><button data-label="${x.id}" data-value="banana">${state.labels[x.id]==='banana'?'✓ ':''}Banana</button></div>`).join('')}</div><div id="trainFeedback" aria-live="polite"></div><button class="primary" id="train">Train Pip on these examples →</button><p class="note">A real, tiny learning algorithm runs in your browser. It compares colour and shape, chooses the feature with fewer training errors, and predicts the majority label for each feature value. Ties favour colour; unseen values use the overall majority.</p>`}
if(state.stage===3){const model=learn();const results=tests.map(x=>({...x,pred:predict(model,x)}));const score=results.filter(x=>x.pred===x.label).length;html=intro('MISSION 03 / TEST','A new shipment.<br><em>An honest test.</em>','These two examples were not used for training. Does Pip’s learned pattern work beyond the examples it already knows?')+`<div class="stats"><div class="stat"><b>${model.feature}</b><small>Feature selected during learning</small></div><div class="stat"><b>${score} / 2</b><small>Unseen examples sorted correctly</small></div></div><div class="cards">${results.map(x=>`<div class="card"><span class="emoji">${x.emoji}</span><h3>${x.name}</h3><p>Shape: ${x.shape}<br>Pip predicts: <strong>${x.pred}</strong><br>Actual label: ${x.label}</p><small>${x.pred===x.label?'✓ Correct':'✕ Misclassified'}</small></div>`).join('')}</div>`+say(state.expanded?'Now shape is a more reliable pattern in our examples. Pip handles these two new fruits correctly. That is encouraging, but two tests do not prove it will recognise every fruit.':'Both colour and shape fitted the original examples perfectly. Pip chose colour to break the tie. It learned a shortcut: our examples were too limited.')+(state.expanded?`<div class="feedback"><strong>Discovery: generalisation.</strong> A model should work on unseen examples. More varied, relevant training data can help, but no small test guarantees universal success.</div>`+next('Open the unlock challenge',4):`<div class="feedback bad"><strong>Discovery: training success is not enough.</strong> Pip fitted all four training examples and still failed on a new example.</div><button class="primary" id="expand">Add more varied examples →</button>`)+`<p class="note">Simplified fruit world: these features and examples teach one principle. Real fruit recognition needs richer data and broader evaluation.</p>`}
if(state.stage===4){const qs=questions();html=intro('THE GATE / APPLY WHAT YOU LEARNED','Restore the signal.<br><em>Earn your passage.</em>','Three situations. Choose the best response in each. Get at least two right to unlock the next district. You can retry with feedback.')+qs.map((q,i)=>`<div class="question"><h3>${i+1}. ${q.q}</h3><div class="options">${q.options.map((o,j)=>`<button data-q="${i}" data-a="${j}" class="${state.answers[i]===j?'selected':''}" aria-pressed="${state.answers[i]===j}">${o}</button>`).join('')}</div></div>`).join('')+`<div id="quizFeedback" aria-live="polite"></div><button class="primary" id="submit">Check my decisions →</button>`}
if(state.stage===5)html=`<div class="certificate"><span class="tag">DISTRICT RESTORED</span><h1>The market is alive.<br><em>Because you helped it learn.</em></h1><p>You diagnosed a brittle rule, labelled examples, tested an unseen shipment, and improved the training data.</p><div class="stats" style="justify-content:center"><div class="stat"><b>${state.lastScore}/3</b><small>Unlock challenge</small></div><div class="stat"><b>4</b><small>Concepts discovered</small></div></div><button class="primary" id="download">Download expedition record ↓</button></div><div class="map"><div class="card"><span class="emoji">🔓</span><div><h3>Next district unlocked: The Learning Lab</h3><p>Your next mission will explore supervised, unsupervised, and reinforcement learning.</p><small>Story preview unlocked · Full chapter coming next</small></div></div></div><div class="dialogue"><strong>TRANSMISSION / THE LEARNING LAB</strong><p>“The doors are open, explorer. Some machines have labels. Some must find their own groups. One learns by trying. Which one can guide our rescue team?”</p></div><p class="note">This pilot contains one complete chapter. Your completion record is self-reported; it is not a verified examination result.</p>`;
$('#scene').innerHTML=html;bind();}
function learn(){const data=(state.expanded?items:items.slice(0,4));let best;for(const feature of ['color','shape']){const groups={};for(const x of data){(groups[x[feature]]??=[]).push(state.labels[x.id])}const majority=a=>a.filter(x=>x==='apple').length>=a.filter(x=>x==='banana').length?'apple':'banana';const map=Object.fromEntries(Object.entries(groups).map(([v,a])=>[v,majority(a)]));const fallback=majority(data.map(x=>state.labels[x.id]));const error=data.filter(x=>map[x[feature]]!==state.labels[x.id]).length;if(!best||error<best.error)best={feature,map,fallback,error}}return best}
function predict(m,x){return m.map[x[m.feature]]||m.fallback}
function questions(){return state.attempt%2===0?[
{q:'A customer-support system learns from messages labelled “refund” or “delivery”. What is happening?',options:['Supervised learning from labelled examples','A person wrote one rule for every future message','Unsupervised grouping without labels'],correct:0,why:'The messages have target labels. Learning a mapping from examples to labels is supervised learning.'},
{q:'A visual classifier trained only on studio photographs fails on phone photographs. What is the best next step?',options:['Test it again only on the studio photographs','Add varied, relevant training photographs and evaluate on separate unseen photographs','Assume every wrong prediction is a hardware fault'],correct:1,why:'Training data should represent intended use. Keep evaluation examples separate from training.'},
{q:'A model gets every training example right. What can you conclude?',options:['It will always be correct','It understands every possible situation','It fits those examples; unseen examples are still needed to evaluate it'],correct:2,why:'Training performance alone does not establish generalisation.'}]:[
{q:'You label design references “poster” and “packaging” to teach a classifier. What do the labels provide?',options:['The desired category for each training example','Proof that the system is conscious','A guarantee of perfect predictions'],correct:0,why:'Labels tell a supervised learning system the target output for each example.'},
{q:'A shop’s model fails on products from a new supplier. What is a useful response?',options:['Hide the failures','Gather representative examples, retrain, and test on held-out examples','Repeat the original training examples forever'],correct:1,why:'Relevant variation in training data can reduce shortcuts; separate tests help measure improvement.'},
{q:'Why did Pip initially choose colour?',options:['Colour is always the best way to recognise fruit','Its limited examples made colour look successful, and its tie rule selected colour','A model can never use shape'],correct:1,why:'The training examples supported multiple patterns. The algorithm’s tie rule selected a misleading shortcut.'}];}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));document.querySelectorAll('[data-rule]').forEach(b=>b.onclick=()=>{$('#ruleFeedback').innerHTML=b.dataset.rule==='right'?`<div class="feedback">Exactly. This is a <strong>rule-based system</strong>: a person specifies the rule. A learning-based system instead estimates patterns from examples. Neither approach is automatically better for every task.</div>${next('Teach Pip using examples',2)}`:`<div class="feedback bad">Pip followed the rule correctly. Look at the tomato and green apple: the rule uses a feature that does not reliably identify apples. Try again.</div>`;bind()});document.querySelectorAll('[data-label]').forEach(b=>b.onclick=()=>{state.labels[b.dataset.label]=b.dataset.value;persist();render()});if($('#train'))$('#train').onclick=()=>{const data=state.expanded?items:items.slice(0,4);if(data.some(x=>state.labels[x.id]!==x.label)){$('#trainFeedback').innerHTML='<div class="feedback bad">Check your labels first. Apples belong to “Apple”; bananas belong to “Banana”. Correct labels give Pip useful training examples.</div>';return}state.trained=true;go(3)};if($('#expand'))$('#expand').onclick=()=>{state.expanded=true;go(2)};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{state.answers[b.dataset.q]=+b.dataset.a;persist();render()});if($('#submit'))$('#submit').onclick=()=>{const qs=questions();if(qs.some((_,i)=>state.answers[i]===undefined)){$('#quizFeedback').innerHTML='<div class="feedback bad">Choose a response to all three situations first.</div>';return}const score=qs.filter((q,i)=>state.answers[i]===q.correct).length;state.lastScore=score;const details=qs.map((q,i)=>`<p><strong>${i+1}. ${state.answers[i]===q.correct?'✓ Correct':'Review this'}</strong> — ${q.why}</p>`).join('');$('#quizFeedback').innerHTML=`<div class="feedback ${score<2?'bad':''}"><strong>${score}/3 correct</strong>${details}</div><button class="primary" id="continueQuiz">${score>=2?'Restore the market →':'Try a fresh challenge →'}</button>`;$('#submit').hidden=true;$('#continueQuiz').onclick=()=>{if(score>=2){state.passed=true;go(5)}else{state.attempt++;state.answers={};persist();render()}};persist()};if($('#download'))$('#download').onclick=()=>{const text=`AI ODYSSEY — EXPEDITION RECORD\nChapter: The Broken Market\nStatus: Completed\nUnlock challenge: ${state.lastScore}/3\nCompleted: ${new Date().toLocaleString()}\nConcepts: rule-based vs learning-based systems; labelled training data; generalisation; representative data.\nThis browser-generated record is self-reported and is not a verified grade.\n`;const url=URL.createObjectURL(new Blob([text],{type:'text/plain'}));const a=document.createElement('a');a.href=url;a.download='AI-Odyssey-Expedition-Record.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
$('#journal').onclick=()=>{$('#modalContent').innerHTML='<span class="tag">FIELD NOTES</span><h2>Your concept journal</h2>'+[{at:2,title:'Rules and learning',text:'Rule-based systems apply explicitly specified instructions. Learning-based systems estimate patterns from data.'},{at:3,title:'Supervised learning',text:'Labelled examples pair inputs with desired outputs. A classifier uses these examples to learn category predictions.'},{at:3,title:'Generalisation',text:'A useful model should perform on new examples. Keep test examples separate from the examples used to train it.'},{at:4,title:'Representative data',text:'Varied examples relevant to the intended task can help reduce misleading shortcuts. Test results on a small sample remain limited.'}].map(x=>`<div class="journalitem ${state.max<x.at?'locked':''}"><h3>${state.max>=x.at?x.title:'🔒 Undiscovered concept'}</h3><p>${state.max>=x.at?x.text:'Continue your expedition to reveal this field note.'}</p></div>`).join('');$('#modal').showModal()};$('#close').onclick=()=>$('#modal').close();$('#reset').onclick=()=>{if(confirm('Restart this chapter and erase progress saved in this browser?')){state={stage:0,max:0,labels:{},trained:false,expanded:false,answers:{},attempt:0,passed:false};persist();render()}};render();
</script></body></html>
